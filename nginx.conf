server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Security headers are declared once, at server level, and must stay here:
    # nginx stops inheriting add_header directives as soon as a location block
    # declares one of its own. Cache policies below therefore use `expires`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # `connect-src blob:` is required by three.js: GLTFLoader fetches embedded
    # textures as blob URLs before decoding them. The Umami tracker posts to
    # gateway.umami.is (not .dev).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: https://cloud.umami.is https://gateway.umami.is; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml model/gltf-binary application/octet-stream;

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The application shell and the generated stats must never be cached.
    location = /index.html {
        expires -1;
    }

    location = /repo_stats.json {
        expires -1;
    }

    # Vite emits content-hashed files under /assets: safe to cache forever.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed media served from public/.
    location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|glb|gltf|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
